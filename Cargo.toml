[package]
authors = ["Cytosine2020", "victoryang00"]
categories = ["heterogenous", "offload"]
edition = "2021"
keywords = ["jit", "compiler", "wasm", "binary-offload"]
license = "MIT"
name = "doublejit_vm"
version = "0.1.0"
[dependencies]
aya-obj = { version = "0.2.1", optional = true, features = ["std"] }
goblin = { version = "0.8", optional = true }
iced-x86 = { version = "1.21", optional = true }
bytemuck = "1.9.1"
getrandom = "0.3.4"
wasm-bindgen = "0.2.104"
wasm-bindgen-test = "0.3.54"
# wasmer = {git = "https://github.com/Multi-V-VM/wasmer"}
wasmer = "6.1.0"
zero = "0.1.2"
wasmer-compiler-cranelift = "6.1.0"
wasmer-compiler-singlepass = "6.1.0"
wasmer-wasix = "0.601.0"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros"] }

[features]
default = []
std = []
ebpf = ["std", "dep:aya-obj"]
x86_elf = ["ebpf", "dep:goblin", "dep:iced-x86"]

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "doublejit-runner"

[[example]]
name = "cache_usage"

[[example]]
name = "perf_demo"

[[example]]
name = "optimizer_demo"

[[bench]]
name = "rvv_ebpf_avx512"
harness = false

[package.metadata.docs.rs]
all-features = true
